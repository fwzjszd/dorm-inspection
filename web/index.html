<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="查寝助手：学生名单管理、查寝登记与记录合并导出，数据全部保存在本机。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="查寝助手">
  <meta name="theme-color" content="#386DED">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>查寝助手</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // 注册 PWA Service Worker，实现离线打开（作用域随 <base> 路径）。
    // CanvasKit 经 --no-web-resources-cdn 同源托管；回落字体基址由
    // tool/patch_bootstrap.ps1 在构建后补丁指向同源 fonts/s/；
    // 全量预缓存清单由 tool/inject_sw_manifest.ps1 在构建后注入。
    window.addEventListener('load', function () {
      if ('serviceWorker' in navigator) {
        var swUrl = new URL('service_worker.js', document.baseURI).href;
        navigator.serviceWorker.register(swUrl).then(function (reg) {
          // 新版本 SW 安装完成后因 skipWaiting 立即激活，接管页面
          // （controllerchange）时自动刷新一次拿到最新产物；首次安装时
          // 页面尚无控制器，不触发刷新。
          function watch(worker) {
            if (!worker) return;
            worker.addEventListener('statechange', function () {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                navigator.serviceWorker.addEventListener('controllerchange', function () {
                  window.location.reload();
                });
              }
            });
          }
          watch(reg.installing);
          reg.addEventListener('updatefound', function () { watch(reg.installing); });
        }).catch(function (e) {
          console.warn('Service worker register failed:', e);
        });
      }
    });
  </script>
</body>
</html>
